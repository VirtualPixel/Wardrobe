# Wardrobe preset library
#
# One [section] per preset. The section header is the preset name shown in the game.
# Every item here is a vanilla R.E.P.O. cosmetic, so anyone in your lobby sees the look
# without installing anything. Items you have not unlocked yet are still written into
# the preset: the slot icon shows the finished look and the doll wears whatever you own
# so far, so unlocking closes the gap on its own.
#
# Slots (case does not matter):
#   hat armright armleft legright legleft footright footleft ears eyewear bodytop bodybottom
#   headbottom facetop facebottom grabbermesh eyelidrightmesh eyelidleftmesh
#   headtopmesh headbottommesh bodytopmesh bodybottommesh armrightmesh armleftmesh
#   legrightmesh legleftmesh bodytopoverlay bodybottomoverlay headtopoverlay
#   headbottomoverlay armrightoverlay armleftoverlay legrightoverlay legleftoverlay
# Pair shortcuts: arms legs feet armsmesh legsmesh eyelids bodyoverlay headoverlay armsoverlay legsoverlay
#
# Values are the cosmetic's in-game name (see catalogue.txt next to this file), or #index.
# skin = <color> tints the bare body parts (head, body, arms, legs, grabber, eyelids).
# color.<slot> = <color> tints one slot. Colors are palette names or the palette index,
# both listed at the top of catalogue.txt. Unlisted slots fall back to the item's own
# default color, then White.
#
# A changed section updates its slot on the next launch, and a removed section clears its
# slot, unless you changed that preset in the game yourself (right-click, Overwrite): then
# the game copy wins and the library leaves it alone. Delete a preset in the game and it
# stays deleted.
#
# Learned from the renders: hair pieces are small tufts on top of the dome, so a look
# needs a hat, mask, goggles, beard or strong color blocks to read. "Arctic Explorer" (hat)
# is the Santa hat, "Tuxedo" (body top) has a bow tie, "Leather Mask" is a cowl with ears,
# "Cheese Semibot" parts have holes, "Mask" (face top) ignores tint and is always green.


